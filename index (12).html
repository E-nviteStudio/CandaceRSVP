<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e0218a">
<title>Candace Caballero's 7th Birthday Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500;1,9..144,700&family=DM+Sans:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<style>
:root{
  --fuchsia:#e0218a; --deep:#b3086a; --glow:#ff5cad; --blush:#ffe7f3; --paper:#fff8fc; --ink:#4a0733;
  --script:'Pacifico','Brush Script MT',cursive; --serif:'Fraunces',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif;
  --r-lg:32px; --r-md:18px; --r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--fuchsia);line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.page{max-width:480px;margin:0 auto;background:var(--fuchsia)}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:8px}

/* Hero */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:56px 28px 40px;overflow:hidden;
  background:radial-gradient(rgba(255,255,255,.16) 3px,transparent 3.5px) 0 0/30px 30px,radial-gradient(120% 60% at 50% 0%,var(--glow),transparent 70%),radial-gradient(90% 50% at 50% 100%,var(--deep),transparent 70%),var(--fuchsia)}
.arch{position:absolute;inset:28px 22px 28px;border:2px solid rgba(255,255,255,.4);border-radius:999px 999px 28px 28px;pointer-events:none}
.arch::after{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.22);border-radius:inherit}
.seal{width:112px;height:112px;margin-bottom:18px;}
.ring{transform-origin:60px 60px;animation:spin 28s linear infinite}
.seal text{font:500 11.5px var(--sans);fill:#fff;letter-spacing:.06em}
.kicker{font:400 1.15rem/1.45 var(--serif);max-width:24ch}
h1{margin:12px 0 18px;filter:drop-shadow(0 4px 0 rgba(179,8,106,.55));font-family:var(--serif);font-style:italic;font-weight:700;line-height:.92}
h1 .first{display:block;font-size:clamp(4rem,23vw,6.6rem);letter-spacing:-.02em;
  background:linear-gradient(105deg,#fff 42%,#ffc2e2 50%,#fff 58%) 120% 0/260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gloss 1.8s .5s ease-out forwards}
h1 .last{display:block;font-size:clamp(1.9rem,10vw,2.9rem);font-weight:500;margin-top:4px}
.when-line{font-family:var(--serif);font-size:1.15rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 30px;border:0;border-radius:var(--r-pill);font:700 1rem var(--sans);cursor:pointer;text-decoration:none;
  background:#fff;color:var(--deep);box-shadow:0 8px 0 var(--deep),0 18px 30px rgba(74,7,51,.3);transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--deep),0 6px 12px rgba(74,7,51,.3)}
.hero .btn{margin-top:30px}
.btn:disabled{opacity:.7;cursor:wait}

/* Ticket */
.when{padding:0 18px 44px}
.ticket{position:relative;display:grid;grid-template-columns:1fr 1px 1fr;background:var(--paper);border-radius:var(--r-lg);padding:30px 8px;text-align:center;box-shadow:0 20px 40px rgba(74,7,51,.28)}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:26px;height:26px;border-radius:50%;background:var(--fuchsia);transform:translateY(-50%)}
.ticket::before{left:-13px}.ticket::after{right:-13px}
.ticket .rule{background:repeating-linear-gradient(to bottom,var(--fuchsia) 0 6px,transparent 6px 12px)}
.ticket .num{font-family:var(--serif);font-weight:700;font-size:4.6rem;line-height:1;color:var(--fuchsia)}
.ticket .big{font-family:var(--serif);font-weight:700;font-size:2.1rem;line-height:1.1;color:var(--fuchsia)}
.ticket .small{font-size:.95rem;margin-top:6px}
.ticket>div{display:flex;flex-direction:column;justify-content:center}
.venue{margin-top:22px;text-align:center;display:flex;flex-direction:column;align-items:center;background:linear-gradient(180deg,#fff,var(--blush));border:3px solid #fff;border-radius:var(--r-lg);padding:22px 16px 0;box-shadow:0 20px 40px rgba(74,7,51,.28)}
.venue .stub{position:relative;align-self:stretch;margin-top:22px;padding:16px 0 18px;border-top:3px dashed var(--fuchsia);font:700 1rem var(--sans);color:var(--deep)}
.venue .stub::before,.venue .stub::after{content:"";position:absolute;top:-14.5px;width:26px;height:26px;border-radius:50%;background:var(--fuchsia)}
.venue .stub::before{left:-32px}
.venue .stub::after{right:-32px}
.venue svg{width:40px;height:40px;fill:var(--fuchsia);margin-bottom:6px}
.venue svg circle{fill:#fff}
.venue strong{font:700 2.8rem/1.05 var(--serif);font-style:italic;color:var(--fuchsia);text-shadow:3px 3px 0 #ffb8dc}
.venue span{font-size:1.1rem;font-weight:500;color:var(--ink);margin-top:6px}
.count{margin:22px 0 14px;text-align:center;color:#fff;font-family:var(--serif);font-size:1.25rem}
.cal{display:flex;justify-content:center}
.cal button{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.7);border-radius:var(--r-pill);min-height:46px;padding:0 22px;font:500 .95rem var(--sans);cursor:pointer}
.cal button:hover{background:rgba(255,255,255,.14)}

/* RSVP */
.rsvp{background:var(--paper);border-radius:var(--r-lg) var(--r-lg) 0 0;padding:44px 24px 36px;margin-top:6px}
.rsvp h2{font-family:var(--serif);font-style:italic;font-weight:700;font-size:2.4rem;line-height:1.05;color:var(--fuchsia)}
.rsvp .lead{margin:8px 0 26px;opacity:.85}
.field{margin-bottom:20px}
.field>label,.field>legend{display:block;font-weight:700;font-size:.92rem;margin-bottom:8px}
fieldset{border:0}
input[type=text],textarea{width:100%;font:400 1rem var(--sans);color:var(--ink);background:#fff;border:2px solid #f6c3de;border-radius:var(--r-md);padding:14px 16px;transition:border-color .2s,box-shadow .2s}
textarea{resize:vertical;min-height:92px}
input::placeholder,textarea::placeholder{color:#b58aa3}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--fuchsia);box-shadow:0 0 0 4px rgba(224,33,138,.16)}
[aria-invalid=true]{border-color:#d4003c!important}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:var(--r-md);border:2px solid #f6c3de;background:#fff;font-weight:700;cursor:pointer;transition:all .18s}
.seg input:checked+span{background:var(--fuchsia);border-color:var(--fuchsia);color:#fff;transform:translateY(-2px);box-shadow:0 6px 0 var(--deep)}
.seg input:focus-visible+span{outline:3px solid var(--ink);outline-offset:3px}
.stepper{display:flex;align-items:center;gap:6px;width:max-content;background:#fff;border:2px solid #f6c3de;border-radius:var(--r-pill);padding:4px}
.stepper button{width:44px;height:44px;border:0;border-radius:50%;background:var(--blush);color:var(--deep);font:700 1.4rem var(--sans);cursor:pointer}
.stepper output{min-width:48px;text-align:center;font:700 1.25rem var(--serif)}
.err{color:#c0003a;font-size:.86rem;font-weight:500;min-height:1.2em;margin-top:6px}
.rsvp .btn{width:100%;background:var(--fuchsia);color:#fff;box-shadow:0 8px 0 var(--deep)}
.rsvp .btn:active{box-shadow:0 2px 0 var(--deep)}
.hp{position:absolute;left:-9999px}
.done{display:none;text-align:center;padding:24px 0}
.done .tick{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--fuchsia);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.done svg{width:42px;height:42px;stroke:#fff;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .3s forwards}
.done p{margin-top:8px}
.sign{margin-top:38px;text-align:center;font-family:var(--serif);font-style:italic;font-size:1.1rem;color:var(--deep)}


/* Girly layer */
.decor{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.sp{position:absolute;width:var(--w,18px);height:var(--w,18px);fill:#fff;filter:drop-shadow(0 0 6px rgba(255,255,255,.95));animation:twinkle 2.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
.fh{position:absolute;bottom:-30px;left:var(--x);font-size:var(--s);color:rgba(255,255,255,.55);animation:rise var(--d) linear infinite}
.hero>:not(.arch):not(.decor){position:relative;z-index:1}
.btn::after{content:"♥";font-size:.9em}
.btn{background-image:linear-gradient(to bottom,rgba(255,255,255,.55),rgba(255,255,255,0) 55%)}
.hero .btn{background-color:#fff;background-image:linear-gradient(to bottom,#fff,#ffd3ea)}
.ticket{background:linear-gradient(180deg,#fff,var(--blush));border:3px solid #fff}
.ticket .num{text-shadow:3px 3px 0 #ffb8dc}
.ticket .big{text-shadow:2px 2px 0 #ffd3ea}
.rsvp h2{font:400 2.2rem/1.2 var(--script);color:var(--fuchsia);text-shadow:2px 2px 0 #ffd3ea}
.sign{font:400 1.3rem var(--script)}
@keyframes twinkle{0%,100%{transform:scale(.4) rotate(0);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(-105vh) rotate(25deg);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes gloss{to{background-position:-20% 0}}
@keyframes pop{from{transform:scale(0)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1 .first{background-position:-20% 0}}
@media (min-width:520px){body{background:#8f0b55}.page{box-shadow:0 0 80px rgba(0,0,0,.35)}}
</style>
</head>

  const end = new Date(d.getTime() + CONFIG.durationHours * 36e5);
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Candace Birthday//EN','BEGIN:VEVENT',
    `UID:candace-birthday-${f(d)}@invitation`,`DTSTAMP:${f(new Date())}`,`DTSTART:${f(d)}`,`DTEND:${f(end)}`,
    "SUMMARY:Candace Caballero's 7th Birthday","LOCATION:Shakey's, near Sunstar Mall",'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], {type:'text/calendar'}));
  a.download = 'candace-7th-birthday.ics';
  a.click(); URL.revokeObjectURL(a.href);
});

/* Guest stepper + conditional field */
let guests = 1;
const setG = n => { guests = Math.min(10, Math.max(1, n)); $('gOut').textContent = guests; };
$('minus').onclick = () => setG(guests - 1);
$('plus').onclick = () => setG(guests + 1);
document.querySelectorAll('input[name=going]').forEach(r => r.addEventListener('change', () => {
  $('guestField').hidden = r.value === 'no' && r.checked;
  $('goErr').textContent = '';
}));
$('name').addEventListener('input', () => { $('nameErr').textContent=''; $('name').removeAttribute('aria-invalid'); });

/* Submit via EmailJS */
if (window.emailjs) emailjs.init({ publicKey: CONFIG.emailjsPublicKey });
$('form').addEventListener('submit', async e => {
  e.preventDefault();
  if ($('hp').value) return;                       // bot trap
  const name = $('name').value.trim();
  const going = document.querySelector('input[name=going]:checked');
  $('sendErr').textContent = '';
  let ok = true;
  if (!name) { $('nameErr').textContent = 'Enter your name so we know who is coming.'; $('name').setAttribute('aria-invalid','true'); $('name').focus(); ok = false; }
  if (!going) { $('goErr').textContent = 'Choose whether you can make it.'; if (ok) document.querySelector('.seg input').focus(); ok = false; }
  if (!ok) return;

  const yes = going.value === 'yes';
  const btn = $('sendBtn');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    if (!window.emailjs) throw new Error('EmailJS failed to load');
    await emailjs.send(CONFIG.serviceId, CONFIG.templateId, {
      from_name: name,
      attending: yes ? 'Yes, will attend' : 'No, cannot attend',
      guests: yes ? String(guests) : '0',
      message: $('message').value.trim() || 'No message'
    });
    $('formBox').style.display = 'none';
    $('done').style.display = 'block';
    $('doneTitle').textContent = yes ? `See you there, ${name.split(' ')[0]}!` : `Thank you, ${name.split(' ')[0]}`;
    $('doneMsg').textContent = yes ? 'Your reply was sent to the Caballero family.' : "Your reply was sent. We'll miss you!";
    $('done').scrollIntoView({behavior:'smooth', block:'center'});
  } catch (err) {
    console.error(err);
    $('sendErr').textContent = 'Your reply did not send. Check your connection and try again.';
    btn.disabled = false; btn.textContent = 'Send my reply';
  }
});
</script>
</body>
